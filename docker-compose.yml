services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hamr_app
      POSTGRES_USER: hamr
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamr -d hamr_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://hamr:${DB_PASSWORD:-changeme}@db:5432/hamr_app
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      RUST_LOG: info
      # ===== Agent 运行时（默认关闭）=====
      # 留空即用各自默认值：BASE_URL 空 → local 默认指向 Ollama，
      # MODEL 空 → local 默认 qwen2.5:7b，API_KEY 空 → 不设置。
      HAMR_AGENT_ENABLED: ${HAMR_AGENT_ENABLED:-false}
      HAMR_AGENT_PROVIDER: ${HAMR_AGENT_PROVIDER:-local}
      # 容器内的 127.0.0.1 是容器自己。接宿主机上的 Ollama 时请设成
      # http://host.docker.internal:11434/v1（下面已配好 host-gateway）。
      HAMR_AGENT_BASE_URL: ${HAMR_AGENT_BASE_URL:-}
      HAMR_AGENT_MODEL: ${HAMR_AGENT_MODEL:-}
      HAMR_AGENT_API_KEY: ${HAMR_AGENT_API_KEY:-}
      # 云端路径默认脱敏，显式放开才传原始 PII
      HAMR_AGENT_ALLOW_PII: ${HAMR_AGENT_ALLOW_PII:-false}
      # 可选：JiaBu 决策引擎（配了才暴露 jiabu_score 工具）
      HAMR_JIABU_URL: ${HAMR_JIABU_URL:-}
    ports:
      - "3002:3002"
    extra_hosts:
      # 让容器能用 host.docker.internal 访问宿主机上的本地模型服务
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${API_URL:-http://localhost:3002}
    ports:
      - "3010:80"
    depends_on:
      - backend

volumes:
  postgres_data:
