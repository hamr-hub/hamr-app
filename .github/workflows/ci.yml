name: CI

on:
  push:
    branches: [main, iter-loop-*]
  pull_request:
    branches: [main]

# 防止同 PR 反复排队：同一 ref 上一次未结束的 run 自动 cancel
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  rust:
    name: Rust (cargo check / test / clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      # ── Step 1: 验证离线依赖完整 ───────────────────────────────
      # cargo fetch --locked 要求 Cargo.lock 不被修改；如果 Cargo.toml 改了
      # 但 lock 没更新，CI 会立刻 fail —— 这正是 round-3 修 libp2p macros
      # 缺失时踩过的坑。完全离线 (--locked) 而不是网络拉取 (--no-lock 隐式),
      # 这样 PR 上传的 .crate 改动不会偷偷引入新依赖。
      - name: cargo fetch --locked (verify offline deps)
        working-directory: backend
        run: cargo fetch --locked

      # ── Step 2: 编译检查（offline） ────────────────────────────
      - name: cargo check --offline --all-targets
        working-directory: backend
        run: cargo check --offline --all-targets

      # ── Step 3: 单测（offline） ────────────────────────────────
      # 全程内存 mock，不连真 libp2p / Postgres；故意把所有用例都跑过，
      # 防止新一轮改动悄悄打破 LWW / 幂等 / DID 验签 (round-1+3 加的)。
      - name: cargo test --offline
        working-directory: backend
        run: cargo test --offline --all-targets

      # ── Step 4: clippy 静态分析（offline） ─────────────────────
      # -D warnings 把警告当错误，避免后续 round 累积技术债
      - name: cargo clippy --offline
        working-directory: backend
        run: cargo clippy --offline --all-targets -- -D warnings
      # 注：fmt --check 暂未启用 —— backend/ 仓库历史里累积了 rustfmt drift，
      # 全量一次性 fmt 会把单测之外的文件一起带进 commit，超出 round-4 范围。
      # 下轮候选：单独立 "chore: cargo fmt" commit 清掉所有 drift 后再加 fmt gate。
